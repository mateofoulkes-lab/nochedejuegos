<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10111a">
  <title>Noche de Juegos</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app">
  <div class="top">
    <div><div class="brand">🎲 Noche de Juegos</div><div class="muted">El celu reparte. La mesa juega.</div></div>
    <div class="version">v0.3.0</div>
  </div>

  <section id="identity" class="card">
    <div class="bigTitle">¿Quién sos?</div>
    <p class="muted">El nombre queda guardado en este dispositivo.</p>
    <div class="row mobile"><input id="nameInput" maxlength="20" placeholder="Nombre"><button id="enterBtn">Entrar</button></div>
  </section>

  <main id="main" class="hidden">
    <section class="card">
      <div class="row"><div class="pill"><span id="netDot" class="dot"></span><span id="netText">Conectando…</span></div><div id="rolePill" class="pill">Jugador</div></div>
      <div class="rule"></div><div id="players" class="players"></div>
    </section>

    <section id="selector" class="card hidden">
      <div class="bigTitle">Elegí el juego</div>
      <p class="muted">Afinado para tres personas alrededor de una mesa.</p>
      <div class="games">
        <button class="game" data-game="chameleon"><span class="emoji">🦎</span><span><b>Camaleón</b><br><span class="muted">Palabra secreta + infiltrado.</span></span></button>
        <button class="game" data-game="spyfall"><span class="emoji">🕵️</span><span><b>Spyfall</b><br><span class="muted">Lugar secreto + espía.</span></span></button>
        <button class="game" data-game="coup"><span class="emoji">👑</span><span><b>Golpe</b><br><span class="muted">Roles, bluff y monedas físicas.</span></span></button>
      </div>
    </section>

    <section id="waiting" class="card hidden center"><div class="emoji">🪑</div><div class="bigTitle">Esperando al admin</div><p class="muted">Cuando elija un juego entran todos automáticamente.</p></section>
    <section id="game" class="card hidden"></section>
  </main>
</div>
<div id="toast" class="toast hidden"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
